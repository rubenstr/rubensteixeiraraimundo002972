<app-menu-superior
  [activeTab]="activeTab()"
  (tabChange)="onTabChange($event)"
  (filterChange)="onFilterChange($event)"
  (createPet)="openCreatePet()"
/>
<section class="p-4">
  <router-outlet
></router-outlet>
</section>

@if (showPetDetail() && selectedPet()) {
  <app-pet-detail-modal
    [pet]="selectedPet()"
    [loading]="loading()"
    (save)="updatePet($event)"
    (close)="closeDetail()"
  />
}


@if (showPetForm()) {
  <app-pet-form-modal
    [pet]="selectedPet()"
    [mode]="formMode()"
    (close)="closeForm()"
  />



}
