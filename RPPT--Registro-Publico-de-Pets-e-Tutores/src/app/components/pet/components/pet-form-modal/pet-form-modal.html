<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="bg-white rounded-lg w-full max-w-lg shadow-lg">

    <header class="px-6 py-4 border-b">
      <h2 class="text-lg font-semibold text-center">
        {{ title() }}
      </h2>
    </header>

    <form
      [formGroup]="form"
      class="p-6 space-y-4"
      (ngSubmit)="submit()">

      <div>
        <label class="text-sm font-medium">Nome</label>
        <input
          type="text"
          formControlName="nome"
          class="w-full mt-1 px-3 py-2 border rounded-md focus:ring focus:ring-primary-200"/>
      </div>

      <!-- <div>
        <label class="text-sm font-medium">Espécie</label>
        <input
          type="text"
          formControlName="especie"
          class="w-full mt-1 px-3 py-2 border rounded-md"/>
      </div> -->

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-medium">Idade</label>
          <input
            type="number"
            formControlName="idade"
            class="w-full mt-1 px-3 py-2 border rounded-md"/>
        </div>

        <div>
          <label class="text-sm font-medium">Raça</label>
          <input
            type="text"
            formControlName="raca"
            class="w-full mt-1 px-3 py-2 border rounded-md"/>
        </div>
      </div>

      <div>
        <label class="text-sm font-medium">Foto</label>
        <input
          type="file"
          accept="image/*"
          (change)="onFileChange($event)"
          class="mt-1 block w-full text-sm"/>
      </div>

      <footer class="flex justify-end gap-3 pt-4 border-t">
        <button
          type="button"
          class="px-4 py-2 text-gray-600 hover:text-gray-800"
          (click)="close.emit()">
          Cancelar
        </button>

        <button
          type="submit"
          [disabled]="loading()"
          class="px-4 py-2 bg-indigo-600 text-white rounded-md">
          {{ loading() ? 'Salvando...' : 'Salvar' }}
        </button>
      </footer>

    </form>
  </div>
</div>
