@if (petsList().length > 0) {

<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4
         gap-4 p-4">
    @for (pet of petsList(); track pet.id) {
    <article class="bg-white border border-gray-200 rounded-lg
             shadow-sm hover:shadow-md transition-shadow
             p-4 flex flex-col gap-2">

        @if (pet.foto) {
        <img [src]="pet.foto.url" [alt]="pet.nome" class="w-full h-36 object-cover rounded-md" />
        } @else {
        <div class="w-full h-36 bg-gray-100 rounded-md
                 flex items-center justify-center text-gray-400 text-sm">
            Sem foto
        </div>
        }

        <h3 class="text-base font-semibold text-gray-800 truncate">
            {{ pet.nome }}
        </h3>

        <div class="text-sm text-gray-600 leading-tight">
            <p><span class="font-medium">Raça:</span> {{ pet.raca }}</p>
            <p><span class="font-medium">Idade:</span> {{ pet.idade }} anos</p>
        </div>

    </article>
    }
</section>

} @else {
<p class="text-gray-500">Nenhum pet encontrado 🐾</p>
}
