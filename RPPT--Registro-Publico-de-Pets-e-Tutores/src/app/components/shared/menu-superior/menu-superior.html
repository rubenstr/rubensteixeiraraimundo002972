<header class="bg-white border-b border-gray-200 px-4 py-3">
  <div class="flex flex-col sm:flex-row sm:items-center gap-3">

    <!-- Tabs (esquerda) -->
    <div class="flex gap-2">
      <button
        class="px-4 py-2 rounded-md text-sm font-medium transition"
        [class.bg-indigo-600]="activeTab() === 'pets'"
        [class.text-white]="activeTab() === 'pets'"
        [class.bg-gray-100]="activeTab() !== 'pets'"
        (click)="selectTab('pets')"
      >
        Pets
      </button>

      <button
        class="px-4 py-2 rounded-md text-sm font-medium transition"
        [class.bg-indigo-600]="activeTab() === 'tutores'"
        [class.text-white]="activeTab() === 'tutores'"
        [class.bg-gray-100]="activeTab() !== 'tutores'"
        (click)="selectTab('tutores')"
      >
        Tutores
      </button>
    </div>

    <!-- Direita: busca + botão -->
    <div
      class="flex flex-col sm:flex-row items-stretch sm:items-center
             gap-3 ml-auto w-full sm:w-auto"
    >
      <!-- Busca -->
      <div class="relative w-full sm:w-72">
        <input
          type="text"
          placeholder="Buscar pet..."
          class="w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md
                 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          (input)="onFilterInput($event)"
        />

        <svg
          class="absolute right-3 top-1/2 -translate-y-1/2
                 w-4 h-4 text-gray-400 pointer-events-none"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 21l-4.35-4.35m1.85-5.15
               a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </div>

      <!-- Botão -->
      @if (activeTab() === 'pets') {
        <button
          type="button"
          class="flex items-center justify-center gap-3
                 px-3 py-1 bg-indigo-600 text-white
                 text-sm font-medium rounded-md
                 hover:bg-indigo-700 transition"
          (click)="onCreatePet()"
        >
          <span class="text-lg">+</span>
          
        </button>
      }
    </div>

  </div>
</header>
