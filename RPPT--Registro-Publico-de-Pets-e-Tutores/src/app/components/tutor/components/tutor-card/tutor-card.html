<div
  class="
    group
    bg-white
    border border-gray-200
    rounded-2xl
    p-4
    cursor-pointer
    transition-all duration-200
    hover:border-indigo-500
    hover:shadow-lg
  "
  (click)="onClick()"
>
  <div class="flex items-center gap-4">

    <div class="relative">
      <img
        [src]="tutor.foto?.url || '/assets/avatar-placeholder.png'"
        alt="Foto do tutor"
        class="
          w-16 h-16
          rounded-full
          object-cover
          border border-gray-300
          transition
          group-hover:border-indigo-500
        "
      />

      <span
        class="
          absolute -bottom-1 -right-1
          w-4 h-4
          rounded-full
          bg-indigo-500
          ring-2 ring-white
        "
      ></span>
    </div>

    <div class="flex-1 min-w-0">
      <h3
        class="
          text-base font-semibold
          text-gray-800
          truncate
          group-hover:text-indigo-600
        "
      >
        {{ tutor.nome }}
      </h3>

      <p class="text-sm text-gray-500 truncate">
        {{ tutor.email }}
      </p>

      <p class="text-sm text-gray-500">
        📞 {{ tutor.telefone }}
      </p>
    </div>
  </div>

  <div
    class="
      mt-3 pt-3
      border-t border-gray-100
      flex items-center justify-between
      text-sm
    "
  >
    <span class="text-gray-400 truncate">
      {{ tutor.endereco }}
    </span>

    <span
      class="
        text-indigo-600
        font-medium
        opacity-0
        group-hover:opacity-100
        transition
      "
    >
      Ver detalhes →
    </span>
  </div>
</div>
