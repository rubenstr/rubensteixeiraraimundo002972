@if (tutor) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">

    <div class="w-full max-w-3xl rounded-xl bg-white shadow-xl">

      <!-- HEADER -->
      <div class="flex items-center justify-between border-b px-6 py-4">
        <h2 class="text-lg font-semibold text-slate-800">
          Detalhes do Tutor
        </h2>

        <button
          class="text-slate-400 hover:text-red-500 text-xl transition"
          (click)="close.emit()">
          ✕
        </button>
      </div>

      <!-- CONTEÚDO -->
      <div class="p-4 space-y-4">

        <!-- DADOS DO TUTOR -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="md:col-span-2 grid grid-cols-1 gap-4">

            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">
                Nome
              </label>
              <input
                class="w-full rounded-lg border px-3 py-2 text-sm
                       focus:ring focus:ring-primary-200
                       disabled:bg-slate-100 disabled:text-slate-500"
                [disabled]="!editMode()"
                [(ngModel)]="tutorEdit().nome"
              />
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">
                Telefone
              </label>
              <input
                class="w-full rounded-lg border px-3 py-2 text-sm
                       focus:ring focus:ring-primary-200
                       disabled:bg-slate-100 disabled:text-slate-500"
                [disabled]="!editMode()"
                [(ngModel)]="tutorEdit().telefone"
              />
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">
                Endereço
              </label>
              <input
                class="w-full rounded-lg border px-3 py-2 text-sm
                       focus:ring focus:ring-primary-200
                       disabled:bg-slate-100 disabled:text-slate-500"
                [disabled]="!editMode()"
                [(ngModel)]="tutorEdit().endereco"
              />
            </div>

          </div>
        </div>

        <!-- AÇÕES -->
        <div class="flex items-center justify-between border-t pt-4">

          <div class="flex gap-3">
            @if (!editMode()) {
              <button
                class="rounded-lg border border-primary-600 px-4 py-2
                       text-sm font-medium text-primary-600
                       hover:bg-primary-50 transition"
                (click)="enableEdit()">
                Editar
              </button>
            } @else {
              <button
                class="rounded-lg border border-slate-300 px-4 py-2
                       text-sm text-slate-700 hover:bg-slate-100 transition"
                (click)="cancelEdit()">
                Cancelar
              </button>

              <button
                class="rounded-lg bg-emerald-600 px-4 py-2
                       text-sm font-medium text-white
                       hover:bg-emerald-700 transition"
                (click)="saveTutor()">
                Salvar
              </button>
            }
          </div>
        </div>

        <!-- PETS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-t pt-6">

          <!-- PETS VINCULADOS -->
          <div>
            <h3 class="mb-3 text-sm font-semibold text-slate-700">
              Pets do Tutor
            </h3>

            <div class="space-y-2">
              @for (pet of petsVinculados; track pet.id) {
                <div class="flex items-center justify-between rounded-lg border px-3 py-2 text-sm">
                  <span>{{ pet.nome }}</span>
                  <button
                    class="text-red-500 hover:text-red-700 transition"
                    (click)="desvincularPet.emit(pet.id)">
                    Remover
                  </button>
                </div>
              }
            </div>
          </div>

          <!-- PETS DISPONÍVEIS -->
          <div>
            <h3 class="mb-3 text-sm font-semibold text-slate-700">
              Pets Disponíveis
            </h3>

            <div class="space-y-2">
              @for (pet of petsDisponiveis; track pet.id) {
                <div class="flex items-center justify-between rounded-lg border px-3 py-2 text-sm">
                  <span>{{ pet.nome }}</span>
                  <button
                    class="text-emerald-600 hover:text-emerald-700 transition"
                    (click)="vincularPet.emit(pet.id)">
                    Vincular
                  </button>
                </div>
              }
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
}
